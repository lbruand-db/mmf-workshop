[project]
name = "mmf-workshop"
version = "0.1.0"
description = "Many-Model Forecasting workshop — build and deploy notebooks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mmf-workshop = "mmf_workshop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmf_workshop"]
